<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestorl | Реєстрація</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">Vestorl</div>
            <p class="subtitle">Створіть власний хмарний простір</p>
            
            <div id="error-box" class="error-msg"></div>

            <form id="register-form">
                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" id="name" placeholder="Як вас звати?" required>
                </div>
                <div class="form-group">
                    <label>Електронна пошта</label>
                    <input type="email" id="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" placeholder="Мінімум 8 символів" required>
                </div>
                <button type="submit" class="btn-auth">Зареєструватися</button>
                <div class="switch-mode">
                    Вже маєте акаунт? <a href="/login">Увійти</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');

            try {
                const response = await fetch('/vbp/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                if (response.ok) {
                    window.location.href = '/login';
                } else {
                    const data = await response.json();
                    errorBox.innerText = data.error || "Помилка реєстрації";
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.innerText = "Сервер недоступний";
                errorBox.style.display = 'block';
            }
        };
    </script>
</body>
</html>
